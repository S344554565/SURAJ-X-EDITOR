<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner MR SURAJ EDITOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="panel-container">
        <div class="panel-title">Select Token Option</div>
        <input type="text" class="custom-input" id="token" placeholder="Single Token">

        <div class="input-label">Enter Single Token</div>
        <input type="text" class="custom-input" id="singleToken" placeholder="">

        <div class="input-label">Enter Inbox/convo uid</div>
        <input type="text" class="custom-input" id="uid" placeholder="">

        <div class="input-label">Enter Your Hater Name</div>
        <input type="text" class="custom-input" id="haterName" placeholder="">

        <div class="input-label">Enter Time (seconds)</div>
        <input type="number" class="custom-input" id="time" placeholder="">

        <div class="input-label">Choose Your Np File</div>
        <div class="file-input-wrapper">
            <input type="file" id="npFile">
        </div>

        <button class="run-btn" onclick="startTask()">Run</button>

        <div class="input-label" style="margin-top: 20px;">Enter Task ID to Stop</div>
        <input type="text" class="custom-input" id="stopTaskId" placeholder="">

        <div class="watermark">Owner MR SURAJ EDITOR</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
